name: 🧪 Test Coverage

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.ignore'
      - '.github/dependabot.yml'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.ignore'
      - '.github/dependabot.yml'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage:
    name: 🔢 Test Coverage on ${{ matrix.os }} (Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    # Allow nightly + beta to fail without failing the whole pipeline; they
    # exist to surface upcoming regressions early, not to block merges.
    continue-on-error: ${{ matrix.rust == 'nightly' || matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        # ARM Linux runners (`ubuntu-*-arm`) are intentionally excluded — the
        # `aws-lc-sys` C dep transitively pulled in by reqwest 0.13's default
        # rustls provider hits the glibc 2.38+ C23 symbol issue on those
        # runners (undefined references to `__isoc23_sscanf` / `__isoc23_strtol`).
        # Add them back once aws-lc-sys ships a fix or once we switch the
        # crypto provider away from aws-lc-rs.
        os:
          - ubuntu-latest
          - ubuntu-22.04
          - macos-latest
          - windows-latest
          - windows-2022
          - windows-11-arm
        # MSRV plus the standard release channels.
        rust: ['1.85.0', stable, beta, nightly]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Canonical dtolnay usage: `@master` is the action ref, and the actual
      # Rust version comes from `with: toolchain:`. This matches what pe-sigscan
      # uses and is the pattern recommended in the action's README.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Run formatting and clippy only on one canonical runner so we don't
      # block on stylistic noise across the matrix.
      - name: Check formatting
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.rust == 'stable' }}
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.rust == 'stable' }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      # MSRV (1.85.0) only needs to *compile* the library + examples. We do
      # not run tests on MSRV because newer dev-dependencies may transitively
      # require a higher toolchain; `cargo build` does not resolve dev-deps.
      - name: MSRV build check
        if: ${{ matrix.rust == '1.85.0' }}
        run: cargo build --all-features --all-targets --verbose

      - name: Build
        if: ${{ matrix.rust != '1.85.0' }}
        run: cargo build --all-features --all-targets --verbose

      # `windows-11-arm` has flaky test-runner support in some Rust toolchains.
      # Build-only there until it stabilizes.
      - name: Run tests
        if: ${{ matrix.rust != '1.85.0' && matrix.os != 'windows-11-arm' }}
        run: cargo test --all-features --all-targets --verbose

      # ── Coverage (single canonical runner only) ──────────────────────────
      - name: Install cargo-llvm-cov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.rust == 'stable' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.rust == 'stable' }}
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Run doc tests
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.rust == 'stable' }}
        run: cargo test --doc --all-features

      - name: Upload coverage to Codecov
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.rust == 'stable' }}
        uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: ./lcov.info
          flags: unittests
          name: codecov-umbrella
